security:
    enable_authenticator_manager: true
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'
    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email
    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css\|images|js)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            user_checker: App\EventSubscriber\UserChecker
            access_denied_handler: App\EventSubscriber\AccessDeniedListener
            form_login:
                login_path: app_login
                check_path: app_login
                default_target_path: dashboard_user_profile
                enable_csrf: true
            logout:
                path: dashboard_logout
    role_hierarchy:
        ROLE_SUPER_ADMIN: ROLE_USER
        ROLE_ADMIN: ROLE_USER
        ROLE_OWNER: ROLE_USER
        ROLE_MANAGEMENT: ROLE_USER
        ROLE_MEDIC: ROLE_USER
        ROLE_ASSISTANCE_MEDICAL: ROLE_USER
        ROLE_ASSISTANCE_MEDICAL_PHARMACY: ROLE_USER
        ROLE_PHYSICAL_THERAPY: ROLE_USER
        ROLE_ORDERLY: ROLE_USER
        ROLE_SOCIAL_WORKER: ROLE_USER
        ROLE_COOK: ROLE_USER
        ROLE_PACIENT: ROLE_USER
        ROLE_RELATION: ROLE_USER
        ROLE_CLEANING: ROLE_USER
        ROLE_RECEPTION: ROLE_USER
        ROLE_PSYCHOTHERAPY: ROLE_USER
    access_control:
        - { path: ^/dashboard/nursing-homes, roles: [ ROLE_ADMIN, ROLE_OWNER, ROLE_MANAGEMENT ] }

          # Security configurations for routes with ROLE_SUPER_ADMIN access
        - { path: ^/dashboard/page, roles: [ROLE_SUPER_ADMIN] }
        - { path: ^/dashboard/menu, roles: [ROLE_SUPER_ADMIN] }
        - { path: ^/dashboard/setting, roles: [ROLE_SUPER_ADMIN] }

        - { path: ^/, roles: PUBLIC_ACCESS }
when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
